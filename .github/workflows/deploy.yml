name: Deploy OTOHASAR

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    name: Sunucuya otomatik güncelle
    runs-on: ubuntu-latest
    steps:
      - name: SSH ile git pull + restart
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            APP=/mnt/1tb_disk/otohasar/app
            DATA=/mnt/1tb_disk/otohasar
            PARENT=/mnt/1tb_disk/otohasar
            REPO=https://github.com/turuncuhouse-ctrl/otohasar.git
            BRANCH=${{ github.ref_name }}

            mkdir -p "$DATA/data/mysql" "$DATA/data/uploads" "$APP"

            sync_to_app() {
              mkdir -p "$APP"
              rsync -a --delete \
                --exclude data --exclude env --exclude app \
                "$PARENT/" "$APP/"
            }

            if [ -d "$APP/.git" ]; then
              cd "$APP"
              git remote set-url origin "$REPO"
              git fetch origin
              git reset --hard "origin/$BRANCH"
            elif [ -d "$PARENT/.git" ]; then
              cd "$PARENT"
              git remote set-url origin "$REPO"
              git fetch origin
              git reset --hard "origin/$BRANCH"
              sync_to_app
              cd "$APP"
            else
              rm -rf "$APP"
              git clone --depth 1 -b "$BRANCH" "$REPO" "$APP"
              cd "$APP"
            fi

            test -f public/assets/js/app.js
            grep -q snapshotInputFiles public/assets/js/app.js

            chmod +x scripts/*.sh
            ./scripts/auto-deploy.sh "$BRANCH"
