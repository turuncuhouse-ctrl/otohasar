name: Deploy OTOHASAR

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    name: Sunucuya otomatik güncelle
    runs-on: ubuntu-latest
    steps:
      - name: SSH ile deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            APP=/mnt/1tb_disk/otohasar/app
            DATA=/mnt/1tb_disk/otohasar
            REPO=https://github.com/turuncuhouse-ctrl/otohasar.git
            BRANCH=${{ github.ref_name }}
            TMP=$(mktemp -d)

            mkdir -p "$DATA/data/mysql" "$DATA/data/uploads" "$APP"

            echo "=== Fresh clone to $APP ==="
            git clone --depth 1 -b "$BRANCH" "$REPO" "$TMP/repo"
            rsync -a --delete \
              --exclude data --exclude env \
              "$TMP/repo/" "$APP/"
            rm -rf "$TMP"

            # Eski kurulumlar kodu DATA kok dizininden okuyor (app/ alt klasoru yok)
            if [ -d "$DATA/public" ] || [ -f "$DATA/Dockerfile" ]; then
              echo "=== Legacy root sync to $DATA ==="
              rsync -a --delete \
                --exclude data --exclude env --exclude app \
                "$APP/" "$DATA/"
            fi

            ASSET_VER=$(grep -oP "'asset_version'\s*=>\s*'\K[0-9]+" "$APP/config/config.php" || echo "14")
            cp "$APP/public/assets/js/app.js" "$APP/public/assets/js/app.${ASSET_VER}.js"
            cp "$APP/public/assets/css/style.css" "$APP/public/assets/css/style.${ASSET_VER}.css"

            test -f "$APP/public/assets/js/app.js"
            grep -q snapshotInputFiles "$APP/public/assets/js/app.js"

            cd "$APP"
            chmod +x scripts/*.sh
            ./scripts/auto-deploy.sh "$BRANCH"

            echo "=== Post-deploy verify ==="
            curl -sf "http://127.0.0.1:4080/assets/js/app.${ASSET_VER}.js" | grep -q snapshotInputFiles
            curl -sf "http://127.0.0.1:4080/sw.js" | grep -q "otohasar-shell-v${ASSET_VER}"

            echo "Deploy OK"
