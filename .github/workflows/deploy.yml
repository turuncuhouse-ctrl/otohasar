name: Deploy OTOHASAR

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    name: Sunucuya otomatik güncelle
    runs-on: ubuntu-latest
    steps:
      - name: SSH ile git pull + restart
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            APP=/mnt/1tb_disk/otohasar/app
            DATA=/mnt/1tb_disk/otohasar
            mkdir -p "$DATA/data/mysql" "$DATA/data/uploads" "$APP"
            cd "$APP"

            # Eski kurulum: kod ust dizinde kalmis olabilir — app'e senkronize et
            if [ ! -f public/assets/js/app.js ] && [ -f ../public/assets/js/app.js ]; then
              rsync -a --delete \
                --exclude data --exclude env --exclude app \
                ../ "$APP/"
            fi

            if [ ! -d .git ]; then
              git init -b main
              git remote add origin https://github.com/turuncuhouse-ctrl/otohasar.git || true
            fi

            git remote set-url origin https://github.com/turuncuhouse-ctrl/otohasar.git
            git fetch origin
            git checkout -B main origin/main 2>/dev/null || git reset --hard origin/main

            chmod +x scripts/*.sh
            ./scripts/auto-deploy.sh ${{ github.ref_name }}
