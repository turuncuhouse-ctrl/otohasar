name: Deploy OTOHASAR

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    name: Sunucuya otomatik güncelle
    runs-on: ubuntu-latest
    steps:
      - name: SSH ile deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            APP=/mnt/1tb_disk/otohasar/app
            DATA=/mnt/1tb_disk/otohasar
            BRANCH=${{ github.ref_name }}
            ARCHIVE="https://codeload.github.com/turuncuhouse-ctrl/otohasar/tar.gz/refs/heads/${BRANCH}"

            mkdir -p "$DATA/data/mysql" "$DATA/data/uploads" "$APP"
            TMP=$(mktemp -d)

            echo "=== Tarball sync ($BRANCH) ==="
            curl -fsSL "$ARCHIVE" -o "$TMP/src.tar.gz"
            mkdir -p "$TMP/extract"
            tar -xzf "$TMP/src.tar.gz" -C "$TMP/extract"
            SRC=$(find "$TMP/extract" -mindepth 1 -maxdepth 1 -type d | head -1)
            test -n "$SRC"
            rsync -a --delete --exclude data --exclude env --exclude .git "$SRC/" "$APP/"
            rm -rf "$TMP"

            if [ -d "$DATA/public" ] || [ -f "$DATA/Dockerfile" ]; then
              echo "=== Legacy root sync to $DATA ==="
              rsync -a --delete \
                --exclude data --exclude env --exclude app \
                "$APP/" "$DATA/"
            fi

            ASSET_VER=$(grep -oP "'asset_version'\s*=>\s*'\K[0-9]+" "$APP/config/config.php" || echo "15")
            cp "$APP/public/assets/js/app.js" "$APP/public/assets/js/app.${ASSET_VER}.js"
            cp "$APP/public/assets/css/style.css" "$APP/public/assets/css/style.${ASSET_VER}.css"

            test -f "$APP/public/assets/js/app.js"
            grep -q snapshotInputFiles "$APP/public/assets/js/app.js"
            grep -q uploadNext "$APP/public/assets/js/app.js"
            grep -q 'cat-input" multiple' "$APP/public/file.php"

            cd "$APP"
            chmod +x scripts/*.sh
            ./scripts/auto-deploy.sh "$BRANCH"

            echo "=== Post-deploy verify ==="
            curl -sf "http://127.0.0.1:4080/assets/js/app.${ASSET_VER}.js" | grep -q uploadNext
            curl -sf "http://127.0.0.1:4080/sw.js" | grep -q "otohasar-shell-v${ASSET_VER}"

            echo "Deploy OK"
