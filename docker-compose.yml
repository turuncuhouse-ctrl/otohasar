services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
      MYSQL_DATABASE: ${DB_NAME:-otohasar}
      MYSQL_USER: ${DB_USER:-otohasar}
      MYSQL_PASSWORD: ${DB_PASSWORD:-otohasar_secret}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  php:
    build: .
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-otohasar}
      DB_USER: ${DB_USER:-otohasar}
      DB_PASSWORD: ${DB_PASSWORD:-otohasar_secret}
      APP_URL: ${APP_URL:-https://otohasar.neciparmagan.net.tr}
    volumes:
      - .:/var/www
      - uploads_data:/var/www/public/uploads
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./public:/var/www/public:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - uploads_data:/var/www/public/uploads:ro
    depends_on:
      - php

volumes:
  db_data:
  uploads_data:
